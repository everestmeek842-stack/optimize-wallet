<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Nexus Login</title>
    <style>
      :root {
        --bg: #070b14;
        --panel: rgba(18, 24, 38, 0.9);
        --panel-alt: rgba(24, 31, 48, 0.9);
        --line: rgba(255,255,255,0.1);
        --text: #eef3ff;
        --muted: #9aa9c7;
        --accent: #7c6cff;
        --accent-2: #31d0aa;
        --danger: #ff6b81;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: radial-gradient(circle at top, #111a2c 0%, var(--bg) 55%);
        color: var(--text);
        font-family: Arial, sans-serif;
      }
      .auth-shell {
        width: min(440px, calc(100vw - 30px));
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 22px;
        box-shadow: 0 20px 60px rgba(0,0,0,0.45);
        overflow: hidden;
      }
      .auth-header {
        padding: 26px 26px 14px;
        text-align: center;
        background: linear-gradient(135deg, rgba(124,108,255,0.24), rgba(49,208,170,0.12));
      }
      .brand {
        width: 52px;
        height: 52px;
        margin: 0 auto 12px;
        display: grid;
        place-items: center;
        border-radius: 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        font-weight: 800;
        font-size: 1.5rem;
        color: white;
      }
      h1 {
        margin: 0;
        font-size: 2rem;
      }
      .auth-body { padding: 20px 26px 26px; }
      .tab-row {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 8px;
        margin-bottom: 18px;
        background: rgba(255,255,255,0.03);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 6px;
      }
      .tab {
        appearance: none;
        border: none;
        background: transparent;
        color: var(--muted);
        padding: 10px 14px;
        border-radius: 10px;
        font-weight: 700;
        cursor: pointer;
      }
      .tab.active {
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
      }
      .form-panel { display: none; }
      .form-panel.active { display: block; }
      label {
        display: block;
        margin-bottom: 14px;
        font-size: 0.85rem;
        color: var(--muted);
      }
      input {
        width: 100%;
        margin-top: 8px;
        padding: 12px 14px;
        border-radius: 12px;
        border: 1px solid var(--line);
        background: rgba(255,255,255,0.04);
        color: var(--text);
        font-size: 1rem;
      }
      button.primary {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 12px 16px;
        background: linear-gradient(135deg, var(--accent), var(--accent-2));
        color: white;
        font-size: 1rem;
        font-weight: 700;
        cursor: pointer;
        margin-top: 10px;
      }
      .message {
        min-height: 24px;
        margin-top: 12px;
        font-size: 0.9rem;
        color: var(--muted);
      }
      .message.error { color: var(--danger); }
      .message.success { color: var(--accent-2); }
      .helper {
        text-align: center;
        color: var(--muted);
        font-size: 0.9rem;
        margin-top: 14px;
      }
    </style>
  </head>
  <body>
    <div class="auth-shell">
      <div class="auth-header">
        <div class="brand">N</div>
        <h1>Nexus</h1>
      </div>
      <div class="auth-body">
        <div class="tab-row">
          <button class="tab active" data-mode="login" type="button">Log in</button>
          <button class="tab" data-mode="register" type="button">Create account</button>
        </div>

        <div id="login-panel" class="form-panel active">
          <form id="login-form">
            <label>
              Email
              <input id="login-email" type="email" placeholder="you@example.com" required />
            </label>
            <label>
              Password
              <input id="login-password" type="password" placeholder="Your password" required />
            </label>
            <button class="primary" type="submit">Log In</button>
          </form>
        </div>

        <div id="register-panel" class="form-panel">
          <form id="register-form">
            <label>
              Full Name
              <input id="register-name" type="text" placeholder="Jane Doe" required />
            </label>
            <label>
              Email
              <input id="register-email" type="email" placeholder="you@example.com" required />
            </label>
            <label>
              Password
              <input id="register-password" type="password" placeholder="At least 8 characters" required />
            </label>
            <button class="primary" type="submit">Create Account</button>
          </form>
        </div>

        <div id="auth-message" class="message"></div>
      </div>
    </div>

    <script>
      const tabs = document.querySelectorAll('.tab');
      const panels = {
        login: document.getElementById('login-panel'),
        register: document.getElementById('register-panel')
      };
      const messageBox = document.getElementById('auth-message');

      function setMode(mode) {
        tabs.forEach((tab) => tab.classList.toggle('active', tab.dataset.mode === mode));
        Object.entries(panels).forEach(([key, panel]) => {
          panel.classList.toggle('active', key === mode);
        });
      }

      tabs.forEach((tab) => {
        tab.addEventListener('click', () => setMode(tab.dataset.mode));
      });

      function showMessage(text, type = 'info') {
        messageBox.textContent = text;
        messageBox.className = 'message';
        if (type === 'error') messageBox.classList.add('error');
        if (type === 'success') messageBox.classList.add('success');
      }

      async function apiRequest(path, payload) {
        const response = await fetch(path, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          credentials: 'include',
          body: JSON.stringify(payload)
        });
        const data = await response.json();
        return { ok: response.ok, data };
      }

      document.getElementById('login-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const email = document.getElementById('login-email').value.trim();
        const password = document.getElementById('login-password').value;
        showMessage('Logging in…');

        const result = await apiRequest('/api/auth/login', { email, password });
        if (!result.ok) {
          showMessage(result.data.error || 'Login failed.', 'error');
          return;
        }

        showMessage('Login successful. Redirecting…', 'success');
        setTimeout(() => window.location.href = '/', 700);
      });

      document.getElementById('register-form').addEventListener('submit', async (event) => {
        event.preventDefault();
        const name = document.getElementById('register-name').value.trim();
        const email = document.getElementById('register-email').value.trim();
        const password = document.getElementById('register-password').value;
        showMessage('Creating account…');

        const result = await apiRequest('/api/auth/register', { name, email, password });
        if (!result.ok) {
          showMessage(result.data.error || 'Registration failed.', 'error');
          return;
        }

        showMessage('Account created. Redirecting…', 'success');
        setTimeout(() => window.location.href = '/', 700);
      });
    </script>

    <!-- Tidio Chat Widget for Customer Engagement -->
    <script src="//code.tidio.co/8rjgmeyagyitmg5fycvmye611mud39lt.js" async></script>

    <!-- Monetization & Analytics Tracking -->
    <script>
      // Track conversion events for Tidio integration
      window.addEventListener('load', () => {
        // Notify Tidio of user authentication page visit
        if (window.tidioChatApi) {
          window.tidioChatApi.on('ready', () => {
            window.tidioChatApi.display('show');
          });
        }
      });

      // Log signup/login events for revenue tracking
      const loginForm = document.getElementById('login-form');
      const registerForm = document.getElementById('register-form');

      if (loginForm) {
        loginForm.addEventListener('submit', () => {
          // Track login event (can be used for affiliate tracking)
          console.log('Login event - ready for Telegram community invitation');
        });
      }

      if (registerForm) {
        registerForm.addEventListener('submit', () => {
          // Track registration event
          console.log('Registration event - monetization opportunity');
        });
      }
    </script>
  </body>
</html>
